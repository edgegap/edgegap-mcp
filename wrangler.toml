# Cloudflare Workers configuration for edgegap-mcp.
#
# Two environments:
#   - default (dev): runs on a workers.dev subdomain for testing
#   - production: routes mcp.edgegap.dev to this Worker
#
# Before deploying:
#   1. wrangler login
#   2. wrangler kv namespace create EDGEGAP_MCP_KV
#      → copy the id and put it under [[kv_namespaces]] below
#   3. wrangler secret put TOKEN_ENCRYPTION_KEY (run `openssl rand -hex 32` to generate)
#   4. wrangler secret put SESSION_SIGNING_KEY  (also `openssl rand -hex 32`)
#   5. wrangler deploy --env production

name = "edgegap-mcp"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Inline the OpenAPI JSON specs into the bundle so we have zero-cold-start spec loading.
# Workers has no filesystem, so we can't readFileSync — we import these as JSON modules instead.
# (See src/lib/spec.ts for how they're consumed.)

# ---------------------------------------------------------------------------
# Default (dev) environment — deploys to <name>.<account>.workers.dev
# ---------------------------------------------------------------------------

# KV namespace for encrypted user tokens. Replace `id` with the value you got
# from `wrangler kv namespace create EDGEGAP_MCP_KV`.
[[kv_namespaces]]
binding = "EDGEGAP_MCP_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"

[vars]
# Public-facing base URL of THIS Worker (not the Edgegap API).
# Used for building OAuth-style callback URLs and consent-screen content.
PUBLIC_BASE_URL = "https://edgegap-mcp.workers.dev"
# Edgegap API base URL — override per environment if you need to point at staging.
EDGEGAP_API_BASE_URL = "https://api.edgegap.com"

# ---------------------------------------------------------------------------
# Production environment — mcp.edgegap.dev
# ---------------------------------------------------------------------------

[env.production]
name = "edgegap-mcp"
routes = [
  { pattern = "mcp.edgegap.dev/*", custom_domain = true }
]

[[env.production.kv_namespaces]]
binding = "EDGEGAP_MCP_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"

[env.production.vars]
PUBLIC_BASE_URL = "https://mcp.edgegap.dev"
EDGEGAP_API_BASE_URL = "https://api.edgegap.com"

# Observability: structured logs to Workers' built-in log stream.
# View with `wrangler tail --env production`.
[observability]
enabled = true

# Smart placement: lets Cloudflare pick the optimal edge location to run the Worker
# relative to where the Edgegap API origin is. Slightly lower latency for tool calls.
[placement]
mode = "smart"
