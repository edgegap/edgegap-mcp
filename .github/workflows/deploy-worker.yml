# Deploy the hosted MCP server to Cloudflare.
#
# Runs on any push to main that touches the Worker, the shared tool code, or
# dependencies. The smoke test at the end is the part that matters: it asserts
# the two behaviours that were broken before — anonymous discovery working, and
# a foreign bearer not being relayed to the Edgegap API.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Not typecheck:worker — src/tools/generic.ts has pre-existing zod v4
        # arity errors that would block every deploy. Fix those and switch this
        # over; until then the worker is bundled by esbuild, which does not
        # typecheck anyway.
        run: npm run typecheck

      - name: Dry run
        run: npx wrangler deploy --config worker/wrangler.jsonc --dry-run --outdir=/tmp/dryrun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the live endpoint
        run: |
          set -e
          BASE=https://mcp.edgegap.dev
          fail() { echo "::error::$1"; exit 1; }

          echo "health"
          [ "$(curl -s -m 10 "$BASE/health")" = "ok" ] || fail "/health did not return ok"

          echo "anonymous initialize returns 200, not 401"
          CODE="$(curl -s -m 15 -o /tmp/init.txt -w '%{http_code}' -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')"
          [ "$CODE" = "200" ] || { cat /tmp/init.txt; fail "initialize returned ${CODE}, expected 200"; }

          echo "anonymous tools/list returns all ten tools"
          N="$(curl -s -m 15 -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | grep -o '"edgegap_[a-z_]*"' | sort -u | wc -l)"
          [ "$N" = "10" ] || fail "tools/list returned ${N} tools, expected 10"

          echo "a foreign bearer is not relayed upstream"
          BODY="$(curl -s -m 15 -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjaSJ9.sig' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"edgegap_list_apps","arguments":{}}}')"
          case "$BODY" in
            *"does not contain an Edgegap"*) echo "foreign bearer rejected locally" ;;
            *) echo "$BODY" | head -c 500; fail "foreign bearer was not caught — it may have been relayed to the Edgegap API" ;;
          esac

          echo "All smoke tests passed"
