# Builds the self-hosted HTTP server image and pushes it to the Edgegap
# container registry, for hosts that pull it (e.g. the support agent VM).
#
# Repository settings needed:
#   variables.EDGEGAP_REGISTRY_PROJECT   registry project, e.g. my-org-abc123
#   secrets.EDGEGAP_REGISTRY_USERNAME    robot account username
#   secrets.EDGEGAP_REGISTRY_TOKEN       robot account token
#
# Tags pushed: sha-<commit> on every push to main, plus main; <version> on v* tags.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/edgegap-mcp

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
