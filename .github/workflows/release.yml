# Release: bump, publish to npm, register with the MCP registry.
#
# Run it from the Actions tab: pick patch / minor / major, press Run.
# Everything that has to stay in lockstep is edited by jq here, never by hand:
#
#   package.json        .version
#   package-lock.json   .version           (npm version does this)
#   server.json         .version
#   server.json         .packages[].version
#
# The last two are the ones that have bitten this repo. The registry validates
# packages[].version against npm and rejects a duplicate top-level .version, so
# a mismatch fails at publish time — after the npm release is already public and
# unrepeatable. The guard step below catches it while it is still free to fix.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Build and validate, publish nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, test
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Bump version
        id: bump
        run: |
          VERSION="$(npm version "${{ inputs.bump }}" --no-git-tag-version | tr -d 'v\n')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Sync server.json
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # jq, not sed. A version string contains dots and the previous
          # hand-rolled sed used "/" as its delimiter, which silently appended
          # the trailing "g" of s///g to the value — twice, in two releases.
          jq --arg v "$VERSION" '
            .version = $v
            | if has("packages") then .packages |= map(.version = $v) else . end
          ' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Verify every version agrees
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          # Strict semver. Catches "0.1.4/g" and anything else malformed
          # BEFORE it reaches npm or the registry.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || fail "Version '$VERSION' is not strict semver"

          PKG="$(jq -r .version package.json)"
          SRV="$(jq -r .version server.json)"
          [ "$PKG" = "$VERSION" ] || fail "package.json is $PKG, expected $VERSION"
          [ "$SRV" = "$VERSION" ] || fail "server.json .version is $SRV, expected $VERSION"

          BAD="$(jq -r --arg v "$VERSION" '[.packages[]? | select(.version != $v) | .version] | join(", ")' server.json)"
          [ -z "$BAD" ] || fail "server.json packages[] versions out of sync: $BAD"

          echo "All version fields agree on $VERSION"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json
          git commit -m "Release ${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD --follow-tags

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Wait for npm to serve the new version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # The registry validates that packages[].version exists on npm and
          # 404s if it asks too early. Poll rather than sleep-and-hope.
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@edgegap%2fmcp/${VERSION}")"
            if [ "$CODE" = "200" ]; then
              echo "npm is serving ${VERSION} after $((i * 10))s"
              exit 0
            fi
            echo "attempt ${i}: npm returned ${CODE}, waiting"
            sleep 10
          done
          echo "::error::npm never served ${VERSION}; registry publish would fail"
          exit 1

      - name: Install mcp-publisher
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset names have changed across releases, so resolve the linux
          # x86_64 tarball from the API rather than hardcoding a filename.
          URL="$(gh release view --repo modelcontextprotocol/registry \
                   --json assets --jq '
                     .assets[].url
                     | select(test("(?i)linux"))
                     | select(test("(?i)(amd64|x86_64)"))
                     | select(endswith(".tar.gz"))' | head -1)"
          [ -n "$URL" ] || { echo "::error::No linux amd64 asset found"; exit 1; }
          echo "Downloading $URL"
          curl -fsSL "$URL" | tar -xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish to the MCP registry
        if: ${{ !inputs.dry_run }}
        env:
          # DNS auth, not github-oidc. OIDC only grants io.github.<org>/*,
          # and this server lives under the dev.edgegap/* namespace, which is
          # tied to the edgegap.dev TXT record. Secret is the 64-char hex
          # Ed25519 private key.
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          ./mcp-publisher login dns --domain edgegap.dev --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish

      - name: Confirm what the registry now serves
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          LATEST="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=dev.edgegap/mcp' \
            | jq -r '[.servers[] | select(._meta["io.modelcontextprotocol.registry/official"].isLatest)][0].server.version')"
          echo "Registry latest: ${LATEST}"
          [ "$LATEST" = "$VERSION" ] || { echo "::error::Registry latest is ${LATEST}, expected ${VERSION}"; exit 1; }
