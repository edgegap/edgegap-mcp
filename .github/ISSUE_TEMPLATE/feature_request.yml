name: Feature request
description: A tool, parameter or guidance the agent is missing.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you or your agent trying to do?
      description: The task, not the solution. e.g. "resize a version after a playtest".
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What got in the way?
      description: The tool that is missing, or what an existing one could not do.
  - type: input
    id: endpoint
    attributes:
      label: Edgegap API endpoint, if you know it
      description: e.g. PATCH /v1/app/{app}/version/{version}. Check spec/ and DESIGN.md "Scope" first.
